name: CI

on:
  push:
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [mega, esp32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.env }}

name: Compile sketches

on:
  push:
  pull_request:

jobs:
  uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - arduino
          libraries: |
            - name: Servo
            - name: LiquidCrystal

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm_control"
version = "0.1.0"
description = "Host-side kinematics, trajectory planning and serial control for the zero_day robotic arm"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["arm_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

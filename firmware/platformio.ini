; PlatformIO project for the arm controller.
; Build:  pio run          Upload:  pio run -t upload          Monitor:  pio device monitor

[platformio]
default_envs = mega

[env]
framework = arduino
monitor_speed = 115200

[env:mega]
platform = atmelavr
board = megaatmega2560
lib_deps = arduino-libraries/Servo@^1.2.1

[env:esp32]
platform = espressif32
board = esp32dev
lib_deps = madhephaestus/ESP32Servo@^3.0.5
build_flags = -DARM_ESP32
